[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2text"
version = "0.1.0"
description = "Simple local audio transcription CLI powered by faster-whisper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Martin Mielke" }
]
dependencies = [
    "faster-whisper>=1.0"
]

[project.scripts]
audio2text = "audio2text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]